<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barn conversion · 3D Model</title>
<style>
  :root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html,body{height:100%;}
  *{margin:0;box-sizing:border-box;}
  body{background:#C9DDE4; font-family:'Space Grotesk',system-ui,sans-serif; overflow:hidden;}
  #c{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none;}
  .chip{
    position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); left:10px;
    background:rgba(247,247,243,.92); color:#22302C; border:1px solid #CDD3CC;
    padding:8px 12px; border-radius:10px; z-index:5; max-width:78vw;
  }
  .chip b{font-size:14px;}
  .chip span{display:block; font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.08em; color:#7E8A83; text-transform:uppercase; margin-top:2px;}
  .panel{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(10px + env(safe-area-inset-bottom,0px));
    display:flex; flex-wrap:wrap; gap:6px; justify-content:center; align-items:center;
    background:rgba(247,247,243,.92); border:1px solid #CDD3CC; border-radius:12px;
    padding:8px 10px; z-index:5; max-width:96vw;
  }
  .panel button{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.08em;
    background:#F7F7F3; color:#22302C; border:1px solid #9AA69E; border-radius:8px;
    padding:7px 9px; cursor:pointer;
  }
  .panel button.on{background:#3E5C50; color:#F2F4EF; border-color:#3E5C50;}
  .sun{display:flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace; font-size:10px; color:#7E8A83;}
  .sun input{width:110px; accent-color:#3E5C50;}
  .hint{
    position:fixed; right:10px; top:calc(10px + env(safe-area-inset-top,0px));
    background:rgba(247,247,243,.85); border:1px solid #CDD3CC; border-radius:10px;
    padding:6px 9px; font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:.06em;
    color:#5A6660; z-index:5; text-transform:uppercase; max-width:44vw; text-align:right;
  }
  .walkpad{position:fixed; right:14px; bottom:calc(78px + env(safe-area-inset-bottom,0px)); z-index:6; display:none; flex-direction:column; gap:8px;}
  .walkpad button{width:52px; height:52px; border-radius:50%; border:1px solid #9AA69E; background:rgba(247,247,243,.9); font-size:18px; color:#22302C;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="chip"><b>Barn conversion</b><span>17 × 6 m + pavilion</span></div>
<div class="hint" id="hint">Drag to orbit · pinch / scroll to zoom · tap a door to open it</div>
<div class="walkpad" id="walkpad"><button id="wUp">▲</button><button id="wDn">▼</button></div>
<div class="panel">
  <button id="bAerial" class="on">AERIAL</button>
  <button id="bPlan">PLAN</button>
  <button id="bWalk">WALK</button>
  <button id="bRoof">ROOF OFF</button>
  <button id="bPhase" class="on">PHASE 2</button>
  <div class="sun">AM<input id="sun" type="range" min="0" max="100" value="64">PM</div>
</div>

<script src="../vendor/three.min.js"></script>
<script src="../vendor/OrbitControls.js"></script>
<script>
(function(){
  // World: x = east, z = south, y = up. Barn NW external corner ~ (0,0). Lane to the north (-z).
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xC9DDE4);
  scene.fog = new THREE.Fog(0xC9DDE4, 110, 260);

  var canvas = document.getElementById('c');
  var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.02;

  var camera = new THREE.PerspectiveCamera(50, 1, 0.1, 600);
  camera.position.set(-13, 18, 27);

  var controls = null;
  if (THREE.OrbitControls){
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(9, 0.8, 1);
    controls.maxPolarAngle = Math.PI/2 - 0.02;
    controls.minDistance = 1.5; controls.maxDistance = 130;
    controls.enableDamping = true; controls.dampingFactor = 0.08;
  }

  // ---------- light
  var hemi = new THREE.HemisphereLight(0xEAF3F4, 0x64705C, 0.7); scene.add(hemi);
  var sunL = new THREE.DirectionalLight(0xFFF2DC, 1.2);
  sunL.castShadow = true;
  sunL.shadow.mapSize.set(2048,2048);
  sunL.shadow.camera.left=-42; sunL.shadow.camera.right=42;
  sunL.shadow.camera.top=42; sunL.shadow.camera.bottom=-42;
  sunL.shadow.camera.far=200; sunL.shadow.bias=-0.0004;
  scene.add(sunL); scene.add(sunL.target);
  sunL.target.position.set(9,0,1);
  function setSun(t){
    var a = (t-0.5)*2.4;
    sunL.position.set(9 - Math.sin(a)*60, 9 + Math.cos(a)*27, 1 + Math.cos(a)*42);   // AM rises east (+x, pond side), noon south, PM sets west (gate side)
    sunL.intensity = 0.7 + Math.cos(a)*0.55;
    hemi.intensity = 0.5 + Math.cos(a)*0.25;
  }
  setSun(0.64);

  // ---------- procedural textures
  function makeTex(w,h,draw,rx,ry){
    var cv = document.createElement('canvas'); cv.width=w; cv.height=h;
    var ctx = cv.getContext('2d'); draw(ctx,w,h);
    var t = new THREE.CanvasTexture(cv);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx||1, ry||1);
    t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
    return t;
  }
  function noise(ctx,w,h,base,vars,n){
    ctx.fillStyle = base; ctx.fillRect(0,0,w,h);
    for (var i=0;i<n;i++){
      ctx.fillStyle = vars[(Math.random()*vars.length)|0];
      ctx.globalAlpha = 0.16 + Math.random()*0.3;
      var s = 1+Math.random()*3;
      ctx.fillRect(Math.random()*w, Math.random()*h, s, s);
    }
    ctx.globalAlpha = 1;
  }
  function cladTex(base,a,b,gap,grain){
    return makeTex(256,256,function(c,w,h){
      c.fillStyle=base; c.fillRect(0,0,w,h);
      for (var y=0; y<h; y+=16){
        c.fillStyle = (Math.random()<0.5)?a:b;
        c.fillRect(0,y,w,14);
        c.fillStyle=gap; c.fillRect(0,y+14,w,2);
        c.globalAlpha=0.12; c.fillStyle=grain;
        for(var i=0;i<10;i++) c.fillRect(Math.random()*w, y+Math.random()*13, 12+Math.random()*30, 1);
        c.globalAlpha=1;
      }
    }, 3, 1);
  }
  var cladT = cladTex('#A8A59C','#9E9B92','#B3B0A7','#7A776F','#CBC8BF'); // silvered larch
  function roofTex(base,hi,lo,fleck){
    return makeTex(256,128,function(c,w,h){
      c.fillStyle=base; c.fillRect(0,0,w,h);
      for (var x=0; x<w; x+=8){
        c.fillStyle=hi; c.fillRect(x,0,3,h);
        c.fillStyle=lo; c.fillRect(x+5,0,2,h);
      }
      c.globalAlpha=0.1; c.fillStyle=fleck;
      for(var i=0;i<26;i++) c.fillRect(Math.random()*w, Math.random()*h, 3, 6);
      c.globalAlpha=1;
    }, 10, 3);
  }
  var roofT = roofTex('#A9AEB0','#C6CBCC','#8C9194','#7F8486'); // galvanised tin
  var grassT = makeTex(256,256,function(c,w,h){ noise(c,w,h,'#7E9A6C',['#6E8C5D','#8CA878','#75935F','#93AC7E'],2600); }, 8,8);
  var meadowT = makeTex(256,256,function(c,w,h){ noise(c,w,h,'#96A272',['#A3AC76','#8A9A66','#B0B383','#7E9160'],2400);
    c.globalAlpha=0.25; c.strokeStyle='#B7B98A';
    for(var i=0;i<40;i++){ c.beginPath(); var x=Math.random()*w,y=Math.random()*h; c.moveTo(x,y); c.lineTo(x+2,y-8); c.stroke(); }
    c.globalAlpha=1; }, 7,7);
  var cropT = makeTex(256,256,function(c,w,h){
    c.fillStyle='#8FA477'; c.fillRect(0,0,w,h);
    for (var y=0;y<h;y+=14){ c.fillStyle='#7C9464'; c.fillRect(0,y,w,6); }
    noise(c,w,h,'rgba(0,0,0,0)',['#9AB080','#7E9666'],700);
  }, 10,10);
  var gravelT = makeTex(256,256,function(c,w,h){ noise(c,w,h,'#C2BCAB',['#B3AC99','#CFC9B8','#A79F8C','#D8D2C2'],3200); }, 5,5);
  var tarmacT = makeTex(256,256,function(c,w,h){
    noise(c,w,h,'#8E8E8A',['#84847F','#979792','#7C7C77'],2600);
    c.globalAlpha=0.25; c.fillStyle='#A9A9A2'; c.fillRect(0,60,w,30); c.fillRect(0,170,w,30); c.globalAlpha=1;
  }, 8,2);
  var oakT = makeTex(256,256,function(c,w,h){
    c.fillStyle='#D9C8A4'; c.fillRect(0,0,w,h);
    for (var x=0;x<w;x+=32){
      c.fillStyle=(Math.random()<0.5)?'#D2BF99':'#E0CFAD'; c.fillRect(x,0,30,h);
      c.fillStyle='#C0AC85'; c.fillRect(x+30,0,2,h);
      c.globalAlpha=0.18; c.strokeStyle='#B9A277';
      for (var i=0;i<6;i++){ c.beginPath(); c.moveTo(x+Math.random()*30,0); c.lineTo(x+Math.random()*30,h); c.stroke(); }
      c.globalAlpha=1;
    }
  }, 4,4);
  var deckT = makeTex(256,256,function(c,w,h){
    c.fillStyle='#A08767'; c.fillRect(0,0,w,h);
    for (var y=0;y<h;y+=20){ c.fillStyle=(Math.random()<0.5)?'#977E5F':'#A98F6E'; c.fillRect(0,y,w,18); c.fillStyle='#7E684D'; c.fillRect(0,y+18,w,2); }
  }, 4,4);
  var concT = makeTex(256,256,function(c,w,h){ noise(c,w,h,'#C9C7C0',['#C2C0B8','#D0CEC7','#BCBAB2'],1800); }, 4,4);
  var barkT = makeTex(256,256,function(c,w,h){ noise(c,w,h,'#5A4130',['#6E5038','#4A3526','#7A5B40','#3F2E22'],2600); }, 6,6);
  var brickT = makeTex(256,256,function(c,w,h){
    c.fillStyle='#B3A793'; c.fillRect(0,0,w,h);
    var cols=['#96543E','#8C4E3B','#A05B42','#7E4634','#9A5F47','#8A5240'];
    var bw=32,bh=14,row=0;
    for (var y=0;y<h;y+=bh+2){
      var off=(row%2)?bw/2:0;
      for (var x=-bw;x<w+bw;x+=bw+2){
        c.fillStyle=cols[(Math.random()*cols.length)|0];
        c.fillRect(x+off,y,bw,bh);
        c.globalAlpha=0.15; c.fillStyle='#5E332A';
        c.fillRect(x+off+Math.random()*bw*0.6, y+Math.random()*bh*0.6, 6, 4);
        c.globalAlpha=1;
      }
      row++;
    }
  }, 6, 2);

  // ---------- materials
  function M(c,r,m){ return new THREE.MeshStandardMaterial({color:c, roughness:(r===undefined?0.92:r), metalness:(m||0)}); }
  var mat = {
    clad: new THREE.MeshStandardMaterial({map:cladT, roughness:0.85}),
    roof: new THREE.MeshStandardMaterial({map:roofT, roughness:0.42, metalness:0.55}),
    frame: M(0x1B1E1D, 0.6), oakR: new THREE.MeshStandardMaterial({map:oakT, roughness:0.75}),
    glass: new THREE.MeshStandardMaterial({color:0xEAF4F2, roughness:0.05, metalness:0.05, transparent:true, opacity:0.13, depthWrite:false, side:THREE.DoubleSide}),
    glassSC: new THREE.MeshStandardMaterial({color:0xD4E6DD, roughness:0.05, metalness:0.08, transparent:true, opacity:0.2, depthWrite:false, side:THREE.DoubleSide}),
    inner: M(0xF7F4EC, 0.95), ceil: M(0xECEAE1, 0.95),
    glow: new THREE.MeshStandardMaterial({color:0xFFF6E2, emissive:0xFFD79A, emissiveIntensity:1.2, roughness:0.5}),
    conc: new THREE.MeshStandardMaterial({map:concT, roughness:0.55}),
    oak: M(0xB29066, 0.8), oakPale: M(0xD8C7A2, 0.85),
    fabricS: M(0x8FA189, 0.95), fabricO: M(0xD9CDB4, 0.95), white: M(0xF6F5F1, 0.9),
    black: M(0x1F1F1F, 0.6), grass: new THREE.MeshStandardMaterial({map:grassT, roughness:1}),
    meadow: new THREE.MeshStandardMaterial({map:meadowT, roughness:1}),
    crop: new THREE.MeshStandardMaterial({map:cropT, roughness:1}),
    gravel: new THREE.MeshStandardMaterial({map:gravelT, roughness:1}),
    tarmac: new THREE.MeshStandardMaterial({map:tarmacT, roughness:0.95}),
    deck: new THREE.MeshStandardMaterial({map:deckT, roughness:0.9}),
    hedge: M(0x45604B, 1), leaf: M(0x587452, 1), leaf2: M(0x6A835C, 1), trunk: M(0x5F4E3B, 1),
    water: new THREE.MeshStandardMaterial({color:0x6F9296, roughness:0.15, metalness:0.3, transparent:true, opacity:0.9}),
    rl: new THREE.MeshStandardMaterial({color:0xE2F0F3, roughness:0.08, metalness:0.1, transparent:true, opacity:0.26, depthWrite:false, side:THREE.DoubleSide}),
    rug: M(0xCDBFA6, 1), rug2: M(0xB7C0AF, 1), steel: M(0x9BA3A0, 0.5, 0.4), butt: M(0x4C5A48, 0.9),
    shed: M(0x6E5F49, 0.9), soilM: M(0x5E4C3B, 1),
    pv: new THREE.MeshStandardMaterial({color:0x1E2A3A, roughness:0.3, metalness:0.5}),
    mesh: new THREE.MeshStandardMaterial({color:0x8E9494, transparent:true, opacity:0.28, side:THREE.DoubleSide, roughness:0.9}),
    glassG: new THREE.MeshStandardMaterial({color:0xE9F3F1, roughness:0.08, metalness:0.05, transparent:true, opacity:0.2, depthWrite:false, side:THREE.DoubleSide}),
    brick: new THREE.MeshStandardMaterial({map:brickT, roughness:0.95}),
    bark: new THREE.MeshStandardMaterial({map:barkT, roughness:1}),
    lawn: (function(){ // mown lawn: stripes computed in world space, so every lawn lines up and stripe widths match
      var m = new THREE.MeshStandardMaterial({map:grassT, roughness:0.95});
      m.onBeforeCompile = function(sh){
        sh.vertexShader = 'varying vec3 vWPos;\n' + sh.vertexShader.replace('#include <begin_vertex>',
          '#include <begin_vertex>\n  vWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
        sh.fragmentShader = 'varying vec3 vWPos;\n' + sh.fragmentShader.replace('#include <map_fragment>',
          '#include <map_fragment>\n  float stripe = mod(floor(vWPos.x / 1.2), 2.0);\n  diffuseColor.rgb *= (stripe < 0.5 ? 0.84 : 1.12);');
      };
      return m;
    })()
  };

  function box(g,w,h,d,m,x,y,z,ns){
    var mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m);
    mesh.position.set(x,y,z); mesh.castShadow=(ns!==true); mesh.receiveShadow=true;
    g.add(mesh); return mesh;
  }
  function rbox(g,x1,z1,x2,z2,y,h,m,ns){ return box(g,Math.abs(x2-x1),h,Math.abs(z2-z1),m,(x1+x2)/2,y+h/2,(z1+z2)/2,ns); }
  function cyl(g,r1,r2,h,m,x,y,z,seg){
    var mesh = new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg||14), m);
    mesh.position.set(x,y,z); mesh.castShadow=true; mesh.receiveShadow=true; g.add(mesh); return mesh;
  }
  function ball(g,r,m,x,y,z,sx,sy,sz){
    var mesh = new THREE.Mesh(new THREE.SphereGeometry(r,12,10), m);
    mesh.position.set(x,y,z); mesh.scale.set(sx||1,sy||1,sz||1);
    mesh.castShadow=true; mesh.receiveShadow=true; g.add(mesh); return mesh;
  }

  var site=new THREE.Group(), barn=new THREE.Group(), roofG=new THREE.Group(), interior=new THREE.Group();
  scene.add(site); scene.add(barn); scene.add(roofG); scene.add(interior);
  var DZ = -2.2; // house pulled 2.2 m closer to the lane (pond stays put)
  barn.position.z=DZ; roofG.position.z=DZ; interior.position.z=DZ;
  var yard = new THREE.Group(); yard.position.z=DZ; scene.add(yard);
  var doors = [], clickables = [];   // every tappable door, gate, shutter and rooflight
  var loftHatch = null, inLoft = false, climbTo = null;
  // phase groups: Phase 1 = Class Q conversion + curtilage; Phase 2 = garden change-of-use application
  var P2 = new THREE.Group(); scene.add(P2);                              // phase 2, site coordinates
  var P2y = new THREE.Group(); P2y.position.z = DZ; scene.add(P2y);       // phase 2, house coordinates
  var P1y = new THREE.Group(); P1y.position.z = DZ; scene.add(P1y); P1y.visible = false;   // phase 1 only

  // =============== LANDSCAPE + LANE (real situation: barn tight behind retained hedge belt) ===============
  var far = new THREE.Mesh(new THREE.PlaneGeometry(500,500), mat.crop);
  far.rotation.x=-Math.PI/2; far.position.set(9,-0.06,3); far.receiveShadow=true; site.add(far);
  rbox(site, -30,-4.8, 48,-8.6, -0.03, 0.05, mat.tarmac, true);   // lane carriageway
  rbox(site, -30,-3.3, 48,-4.8, -0.035, 0.04, mat.grass, true);   // near verge (narrow, per photo)
  rbox(site, -30,-8.6, 48,-10.4, -0.035, 0.04, mat.grass, true);  // far verge
  rbox(site, -30,-10.4, 48,-40, -0.04, 0.03, mat.crop, true);     // field beyond lane
  rbox(site, -22,-3.3, 30,14, -0.02, 0.04, mat.meadow, true);     // rough meadow runs to the verge
  rbox(yard, -1.2,5.6, 19.6,10.6, -0.01, 0.045, mat.lawn, true); // phase 1 mown apron

  // hedge + tree belt along lane (retained), gap at the field access east
  function hedgeLine(alongX, c, a0, a1, H, W, gaps, g){ // tidy, continuous hedge: overlapping sections every 0.5 m
    g = g || site;
    for (var t=a0; t<=a1+0.001; t+=0.5){
      var inGap = false; (gaps||[]).forEach(function(q){ if (t>q[0] && t<q[1]) inGap = true; });
      if (inGap) continue;
      var h = H*(0.94+Math.random()*0.1), w = W*(0.92+Math.random()*0.12), m = (Math.random()<0.5?mat.hedge:mat.leaf);
      if (alongX) ball(g, 0.5, m, t, h/2, c+(Math.random()-0.5)*0.06, 1.15, h, w);
      else ball(g, 0.5, m, c+(Math.random()-0.5)*0.06, h/2, t, w, h, 1.15);
    }
  }
  function hedgerow(x1,x2,z,gapA,gapB,sc){
    sc = sc || 1;
    for (var x=x1; x<=x2; x+=1.1){
      if (gapA!==undefined && x>gapA && x<gapB) continue;
      if (sc<1 && Math.random()<0.22) continue; // scrappy, per photo
      var r = (0.85+Math.random()*0.35)*sc;
      ball(site, r, (Math.random()<0.5?mat.hedge:mat.leaf), x, (0.8+Math.random()*0.3)*sc, z+(Math.random()*0.5-0.25), 1,0.85,0.8);
    }
  }
  hedgeLine(true, -4.2, -24, 44, 1.2, 0.7, [[-8.6,-1.4]]);   // roadside hedge: continuous, thin, on the verge clear of the fence; gap for the gates
  hedgerow(-24, 44, -10.2);              // far side of lane
  function tree(x,z,s){
    var h = 2.6*s;
    cyl(site, 0.09*s, 0.14*s, h, mat.trunk, x, h/2, z, 8);
    ball(site, 1.1*s, mat.leaf,  x+0.2*s, h+0.5*s, z, 1,0.9,1);
    ball(site, 0.9*s, mat.leaf2, x-0.6*s, h+0.1*s, z+0.3*s);
    ball(site, 0.8*s, mat.hedge, x+0.5*s, h+0.1*s, z-0.4*s);
  }
  tree(-9,-3.7,1.5); tree(13,-3.8,1.5); tree(33,-3.7,1.3);
  tree(-14,-10.3,1.6); tree(6,-10.4,1.3); tree(27,-10.2,1.5); tree(-23,11,1.9); tree(33,13,1.6);
  // telegraph pole
  cyl(site, 0.07,0.09, 6.2, mat.trunk, 1.4, 3.1, -4.3, 8);                   // clear of the gateway and sightline
  box(site, 1.1,0.08,0.08, mat.trunk, 1.4, 5.6, -4.3);
  // post + parcel box outside the gate: deliveries without opening the gate or meeting the dog
  (function(){
    cyl(site, 0.05,0.05, 0.95, mat.oakPale, -7.65, 0.47, -4.25, 8);
    box(site, 0.5,0.55,0.38, M(0x2C3032,0.55,0.35), -7.65, 1.2, -4.25);       // parcel box, door to the lane
    box(site, 0.3,0.03,0.02, mat.black, -7.65, 1.36, -4.45);                   // letter slot
    box(site, 0.34,0.1,0.02, mat.oakPale, -7.65, 1.05, -4.45);                 // house name plate
  })();

  // access drive from the lane at the WEST end (matches Street View), running down the west gable to parking
  rbox(site, -6.3,-4.8, -2.3,4.3, 0.0, 0.045, mat.gravel, true);           // drive 4 m, centred on the gate
  for (var bz=-0.9; bz<=3.8; bz+=0.75) if (bz<0.0 || bz>1.4) ball(site, 0.46, (Math.random()<0.5?mat.hedge:mat.leaf), -1.15, 0.42, bz, 1,0.9,1); // deeper planting outside the master's west glass

  box(interior, 1.2,0.72,0.6, mat.oakPale, 7.35, 0.36, 5.68);          // bed 3 desk under the window

  rbox(interior, 6.25,0.05, 7.6,0.5, 0, 0.42, mat.fabricS);            // window seat
  box(interior, 0.5,0.1,0.35, mat.fabricO, 4.2, 0.48, 0.3);
  rug(3.3,0.65, 8.1,1.5);
  // NORTH LOBBY: library continues under the window, MVHR in a tall cupboard
  rbox(interior, 8.3,0.05, 9.55,0.4, 0, 0.85, mat.oakR);

  // BOOT-UTILITY: family door lands here, mud stays here, door on to the hall
  rbox(interior, 8.3,4.2, 10.1,4.62, 0, 0.9, mat.white);               // sink + washer run
  (function(){ // device drawer: every phone and tablet charges here overnight, not in bedrooms
    var dg = new THREE.Group(); interior.add(dg);
    var df = box(dg, 0.6, 0.16, 0.025, mat.oakPale, 8.75, 0.78, 4.635);
    box(dg, 0.56, 0.04, 0.4, mat.black, 8.75, 0.72, 4.43);
    box(dg, 0.4, 0.012, 0.02, mat.glow, 8.75, 0.84, 4.65, true);
    var D = {type:'slidez', grp:dg, open:false, shift:0.35};
    df.userData.door = D; doors.push(D); clickables.push(df);
  })();
  cyl(interior, 0.25,0.25,0.02, mat.frame, 9.65, 0.48, 4.63, 16).rotation.x=Math.PI/2;
  rbox(interior, 8.3,4.2, 10.1,4.55, 1.5, 0.7, mat.white);             // wall cupboards over
  rbox(interior, 8.3,4.75, 8.72,5.9, 0, 0.45, mat.oakPale);            // boot bench, west wall
  cyl(interior, 0.33,0.38, 0.14, mat.fabricO, 16.45, 0.07, 1.25, 16);   // the dog's bed in the morning sun, off every route
  // WC + HALL
  rbox(interior, 11.05,0.15, 11.5,0.6, 0, 0.42, mat.white);   // WC pan on the far wall, clear of the door
  rbox(interior, 10.28,0.08, 10.66,0.38, 0.55, 0.3, mat.white);  // corner hand basin
  // LARDER
  rbox(interior, 11.7,0.15, 11.95,1.4, 0, 1.9, mat.oakPale);
  rbox(interior, 12.0,0.15, 12.62,0.42, 0, 1.9, mat.oakPale);
  // KITCHEN: north run + island turned so the cook faces the pavilion, child step
  rbox(interior, 12.78,0.12, 16.6,0.78, 0, 0.92, mat.oakR);            // run under north window, now running to the larder wall
  rbox(interior, 13.1,1.85, 15.3,2.75, 0, 0.92, mat.oakR);             // island: 1.07 m working aisle behind
  box(interior, 2.2,0.04,0.94, mat.white, 14.2, 0.95, 2.3);            // worktop
  cyl(interior,0.02,0.02,0.3,mat.steel, 13.4,1.05,0.45,8);             // tap
  [13.6,14.4,15.2].forEach(function(px){ pendant(px, 1.85, 2.3); });
  // DINING at the east gable glass
  rbox(interior, 13.6,4.0, 16.0,5.0, 0.72, 0.06, new THREE.MeshStandardMaterial({map:oakT,roughness:0.6}));
  [[13.8,4.0],[14.8,4.0],[15.8,4.0]].forEach(function(p){ box(interior,0.06,0.72,0.06,mat.oakPale,p[0],0.36,p[1]+0.05); box(interior,0.06,0.72,0.06,mat.oakPale,p[0],0.36,p[1]+0.9); });
  chair(13.95,3.97,0); chair(14.8,3.97,0); chair(15.65,3.97,0);
  chair(13.95,5.03,Math.PI); chair(14.8,5.03,Math.PI); chair(15.65,5.03,Math.PI);
  pendant(14.8, 2.1, 4.5);
  rug(13.3,3.6, 16.3,5.4);
  plant(16.5,5.7,1.0);
  // PAVILION: two sofas + chair around low table, floor lamp, rug
  rug(12.9,7.5, 15.9,9.2, mat.rug2);
  (function(){
    function sofa(x,z,w,d,rot){
      var s=new THREE.Group();
      box(s,w,0.32,d,mat.fabricS,0,0.22,0);
      box(s,w,0.35,0.16,mat.fabricS,0,0.55,-d/2+0.08);
      box(s,0.14,0.3,d,mat.fabricS,-w/2+0.07,0.5,0); box(s,0.14,0.3,d,mat.fabricS,w/2-0.07,0.5,0);
      box(s,w*0.42,0.14,0.3,mat.fabricO,-w*0.22,0.62,-d/2+0.2); box(s,w*0.42,0.14,0.3,mat.fabricO,w*0.22,0.62,-d/2+0.2);
      s.position.set(x,0,z); s.rotation.y=rot||0; interior.add(s);
    }
    sofa(14.3, 7.4, 2.6, 0.95, 0);                                              // one sofa, facing the garden: 1.2 m walk-round each end
    sofa(16.2, 8.75, 0.85, 0.85, -1.15);                                        // lounge chair by the east glass, turned to the group
    cyl(interior, 0.42,0.42, 0.34, mat.oakPale, 14.3, 0.2, 8.55, 24);          // round coffee table
    cyl(interior,0.02,0.02,1.5,mat.frame,12.75,0.75,7.0,6);                     // floor lamp at the sofa end
    ball(interior,0.16,mat.glow,12.75,1.55,7.0);
    var Lp = new THREE.PointLight(0xFFE0B0, 0.5, 6, 2); Lp.position.set(12.75,1.5,7.0); interior.add(Lp);
    plant(12.05,9.5,1.0);
    // TV without a TV: ceiling projector behind the sofa, screen drops from a slot in front of the slider. Tap the slot.
    box(interior, 0.34,0.12,0.3, mat.black, 14.3, 2.22, 6.7);                   // projector, recessed in the ceiling
    box(interior, 2.3,0.05,0.12, mat.frame, 14.3, 2.27, 9.5);                   // ceiling slot
    (function(){
      var sm = new THREE.MeshStandardMaterial({color:0xF2F1EC, roughness:0.95, side:THREE.DoubleSide});
      var sc = box(interior, 2.1, 1.55, 0.015, sm, 14.3, 2.25-0.775, 9.5, true);
      sc.scale.y = 0.02; sc.position.y = 2.25 - 1.55*0.01;
      var hit = box(interior, 2.4, 0.25, 0.3, new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}), 14.3, 2.15, 9.5, true);
      hit.castShadow = false;
      var D = {type:'blind', mesh:sc, top:2.25, h:1.55, cur:0.02, open:false};
      hit.userData.door = D; sc.userData.door = D; doors.push(D); clickables.push(hit, sc);
    })();
  })();

  // =============== UI / MODES ===============
  var roofOn=true, walk=false, yaw=Math.PI, pitch=0, keys={}, padF=false, padB=false;
  function flyTo(pos,tgt){
    walkOff();
    var p0=camera.position.clone(), t0=controls?controls.target.clone():new THREE.Vector3(9,1,3);
    var p1=new THREE.Vector3().fromArray(pos), t1=new THREE.Vector3().fromArray(tgt);
    var s=performance.now();
    (function step(){
      var k=Math.min((performance.now()-s)/900,1), e=k*k*(3-2*k);
      camera.position.lerpVectors(p0,p1,e);
      if (controls) controls.target.lerpVectors(t0,t1,e);
      if (k<1) requestAnimationFrame(step);
    })();
  }
  function setActive(id){ ['bAerial','bPlan','bWalk'].forEach(function(b){ document.getElementById(b).classList.toggle('on',b===id); }); }
  function setRoof(on){
    roofOn = on; roofG.visible = on;
    var rb = document.getElementById('bRoof');
    rb.textContent = on ? 'ROOF OFF' : 'ROOF ON'; rb.classList.toggle('on', !on);
  }
  document.getElementById('bAerial').onclick=function(){ setActive('bAerial'); setRoof(true); flyTo([-13,18,25],[9,0.5,1]); };
  document.getElementById('bPlan').onclick=function(){ setActive('bPlan'); setRoof(false); flyTo([8.5,58,0.86],[8.5,0,0.8]); };
  document.getElementById('bRoof').onclick=function(){ setRoof(!roofOn); };
  var phase = 2;
  document.getElementById('bPhase').onclick=function(){
    phase = (phase===2) ? 1 : 2;
    P2.visible = P2y.visible = (phase===2); P1y.visible = (phase===1);
    this.textContent = 'PHASE ' + phase;
  };
  document.getElementById('sun').oninput=function(){ setSun(this.value/100); };
  function walkOn(){
    walk=true; setActive('bWalk');
    if (controls) controls.enabled=false;
    camera.position.set(10.9,1.6,3.2); yaw=Math.PI; pitch=0; inLoft=false; climbTo=null;
    document.getElementById('walkpad').style.display=('ontouchstart' in window)?'flex':'none';
    document.getElementById('hint').textContent='Drag to look · WASD / arrows or ▲▼ to move';
  }
  function walkOff(){
    if (!walk) return; walk=false;
    if (controls) controls.enabled=true;
    document.getElementById('walkpad').style.display='none';
    document.getElementById('hint').textContent='Drag to orbit · pinch / scroll to zoom';
  }
  document.getElementById('bWalk').onclick=function(){ walk?(walkOff(),setActive('bAerial')):walkOn(); };
  function climb(){ // up the loft ladder, or back down it
    if (!walk) walkOn();
    if (loftHatch && !loftHatch.open) loftHatch.open = true;
    inLoft = !inLoft;
    climbTo = inLoft ? {x:5.35, y:3.35, z:2.4+DZ, yaw:0} : {x:6.1, y:1.6, z:1.05+DZ, yaw:-Math.PI/2};
    document.getElementById('hint').textContent = inLoft ? 'In the loft · tap the ladder to climb down' : 'Drag to look · WASD / arrows or ▲▼ to move';
  }

  var dragging=false, lx=0, ly=0, pdX=0, pdY=0;
  var ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
  canvas.addEventListener('pointerdown',function(e){ pdX=e.clientX; pdY=e.clientY; if(!walk) return; dragging=true; lx=e.clientX; ly=e.clientY; });
  window.addEventListener('pointerup',function(e){
    dragging=false;
    if (Math.abs(e.clientX-pdX)<7 && Math.abs(e.clientY-pdY)<7){
      ndc.x=(e.clientX/window.innerWidth)*2-1; ndc.y=-(e.clientY/window.innerHeight)*2+1;
      ray.setFromCamera(ndc,camera);
      var hits=ray.intersectObjects(clickables,false).filter(function(h){ for (var o=h.object; o; o=o.parent){ if (!o.visible) return false; } return true; });
      if (hits.length && hits[0].object.userData.climb){ climb(); }
      else if (hits.length && hits[0].object.userData.door) hits[0].object.userData.door.open = !hits[0].object.userData.door.open;
    }
  });
  window.addEventListener('pointermove',function(e){
    if(!walk||!dragging) return;
    yaw-=(e.clientX-lx)*0.004; pitch-=(e.clientY-ly)*0.003;
    pitch=Math.max(-1.2,Math.min(1.2,pitch)); lx=e.clientX; ly=e.clientY;
  });
  window.addEventListener('keydown',function(e){ keys[e.key.toLowerCase()]=true; });
  window.addEventListener('keyup',function(e){ keys[e.key.toLowerCase()]=false; });
  var wU=document.getElementById('wUp'), wD=document.getElementById('wDn');
  wU.addEventListener('pointerdown',function(e){e.preventDefault();padF=true;});
  wD.addEventListener('pointerdown',function(e){e.preventDefault();padB=true;});
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){ wU.addEventListener(ev,function(){padF=false;}); wD.addEventListener(ev,function(){padB=false;}); });

  function resize(){ var w=window.innerWidth,h=window.innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
  window.addEventListener('resize',resize); resize();

  var clock=new THREE.Clock();
  (function loop(){
    requestAnimationFrame(loop);
    var dt=Math.min(clock.getDelta(),0.05);
    if (walk){
      var f=(keys['w']||keys['arrowup']||padF?1:0)-(keys['s']||keys['arrowdown']||padB?1:0);
      var st=(keys['d']?1:0)-(keys['a']?1:0);
      var sp=2.6*dt;
      camera.position.x+=(Math.sin(yaw)*f+Math.cos(yaw)*st)*sp;
      camera.position.z+=(Math.cos(yaw)*f-Math.sin(yaw)*st)*sp;
      if (climbTo){
        camera.position.x += (climbTo.x-camera.position.x)*Math.min(1,4*dt);
        camera.position.z += (climbTo.z-camera.position.z)*Math.min(1,4*dt);
        camera.position.y += (climbTo.y-camera.position.y)*Math.min(1,3*dt);
        yaw += (climbTo.yaw-yaw)*Math.min(1,4*dt); pitch += (0-pitch)*Math.min(1,4*dt);
        if (Math.abs(climbTo.y-camera.position.y)<0.02) climbTo = null;
      } else camera.position.y = inLoft ? 3.35 : 1.6;
      camera.lookAt(new THREE.Vector3(
        camera.position.x+Math.sin(yaw)*Math.cos(pitch),
        camera.position.y+Math.sin(pitch),
        camera.position.z+Math.cos(yaw)*Math.cos(pitch)));
      if (keys['arrowleft']) yaw+=1.6*dt;
      if (keys['arrowright']) yaw-=1.6*dt;
    } else if (controls) controls.update();
    var k = Math.min(1, 9*dt);
    for (var di=0; di<doors.length; di++){
      var D = doors[di];
      if (D.type==='swing') D.pivot.rotation.y += ((D.open?D.target:0) - D.pivot.rotation.y)*k;
      else if (D.type==='hingex'){ D.pivot.rotation.x += ((D.open?D.target:0) - D.pivot.rotation.x)*k;
        if (D.ladder){ var op = D.pivot.rotation.x / D.target; D.ladder.visible = op > 0.5; D.ladder.scale.y = Math.max(0.02, Math.min(1, (op-0.5)*2)); } }
      else if (D.type==='slide2'){ for (var gi=0; gi<D.grps.length; gi++) D.grps[gi].position.x += ((D.open?D.shifts[gi]:0) - D.grps[gi].position.x)*k; }
      else if (D.type==='fold'){ D.cur += ((D.open?0.06:1) - D.cur)*k; D.grp.scale.set(D.cur,1,D.cur); }
      else if (D.type==='blind'){ D.cur += ((D.open?1:0.02) - D.cur)*k; D.mesh.scale.y = D.cur; D.mesh.position.y = D.top - D.h*D.cur/2; }
      else if (D.type==='slidez') D.grp.position.z += ((D.open?D.shift:0) - D.grp.position.z)*k;
      else D.grp.position.x += ((D.open?D.shift:0) - D.grp.position.x)*k;
    }
    renderer.render(scene,camera);
  })();
})();
</script>
