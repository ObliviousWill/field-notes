<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bathroom planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f3; --panel:#ffffff; --ink:#1c2731; --muted:#5b6874; --line:#dde3e8; --chip:#f2f5f7;
  --accent:#a8551f; --accent-soft:#f6e9df; --ok:#2d7a57; --ok-soft:#e3f1ea; --warn:#8f5d10; --warn-soft:#fbf0dc;
  --bad:#b83227; --bad-soft:#fae6e3; --focus:#1f6fb2;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151b21; --panel:#1b232b; --ink:#e7ecf0; --muted:#9aa7b3; --line:#2c3843; --chip:#232d37;
    --accent:#e08a4f; --accent-soft:#3a2a1f; --ok:#6cc79c; --ok-soft:#1d3329; --warn:#e6b35a; --warn-soft:#3a2f1a;
    --bad:#f07b6e; --bad-soft:#3d2320; --focus:#7db8ea;
  }
}
:root[data-theme="dark"]{
  --bg:#151b21; --panel:#1b232b; --ink:#e7ecf0; --muted:#9aa7b3; --line:#2c3843; --chip:#232d37;
  --accent:#e08a4f; --accent-soft:#3a2a1f; --ok:#6cc79c; --ok-soft:#1d3329; --warn:#e6b35a; --warn-soft:#3a2f1a;
  --bad:#f07b6e; --bad-soft:#3d2320; --focus:#7db8ea;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 Archivo,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:100%}
.stage{position:relative;min-height:0;min-width:0;overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:none}
.views{position:absolute;top:14px;left:14px;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;box-shadow:0 2px 10px rgba(20,30,40,.08)}
.views button{border:0;background:none;padding:7px 12px;border-radius:7px;font-weight:700;font-size:14px;color:var(--muted)}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.hint{position:absolute;left:14px;bottom:14px;right:14px;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px;color:var(--muted);box-shadow:0 2px 10px rgba(20,30,40,.08)}

.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:22px 22px 32px;min-height:0}
h1{font-size:23px;font-weight:800;letter-spacing:-.01em;margin:0}
.room-sum{margin:2px 0 14px;color:var(--muted);font-weight:600}
h2{font-size:15px;font-weight:700;margin:0 0 10px}
section{padding:18px 0;border-top:1px solid var(--line)}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:700;padding:6px 11px;border-radius:999px;font-size:14px}
.status::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.status.warn{background:var(--warn-soft);color:var(--warn)}
.status.bad{background:var(--bad-soft);color:var(--bad)}
.issues{list-style:none;margin:10px 0 16px;padding:0;display:grid;gap:6px}
.issues li{font-size:14px;padding-left:14px;position:relative}
.issues li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;border-radius:50%}
.issues li.bad::before{background:var(--bad)}
.issues li.warn::before{background:var(--warn)}

.layouts{display:grid;gap:6px}
.layouts button{text-align:left;border:1px solid var(--line);background:var(--chip);border-radius:9px;padding:10px 12px;font-weight:700}
.layouts button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

.sel{background:var(--accent-soft);border-radius:12px;padding:14px;border:1px solid var(--accent)}
.sel h2{font-size:16px;margin:0}
.sel .meta{margin:2px 0 10px;color:var(--muted);font-size:14px}
.gaps{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0 0 12px;font-size:14px}
.gaps dt{color:var(--muted)}
.gaps dd{margin:0;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 11px;font-weight:700;font-size:14px}
.btn.danger{color:var(--bad)}
.keys{margin:10px 0 0;font-size:13px;color:var(--muted)}

.adds{display:grid;gap:5px}
.adds button{display:flex;justify-content:space-between;align-items:baseline;gap:10px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 12px;font-weight:600}
.adds button span{color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap}
.adds h3{font-size:13px;font-weight:700;color:var(--muted);margin:8px 0 2px}

.look{margin-bottom:14px}
.look > span{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px 5px 6px;font-size:13.5px;font-weight:600}
.chips button i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:block}
.chips button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields label{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.fields label.wide{grid-column:1/-1}
.fields input{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:8px 10px;font-weight:700;color:var(--ink);width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;background:var(--chip)}
.seg button{flex:1;border:0;background:none;border-radius:6px;padding:6px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sub{font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 5px}
.toggles{display:grid;gap:8px;margin-top:14px}
.toggles label{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px}
.toggles input{width:18px;height:18px;accent-color:var(--accent)}
.door-info{margin:12px 0 0;font-size:14px;font-weight:600}
.reset{margin-top:16px}

@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:55% 45%}
  .panel{border-left:0;border-top:1px solid var(--line);padding:16px 16px 28px}
  h1{font-size:20px}
  .hint{font-size:12.5px;padding:7px 10px;bottom:10px;left:10px}
  .views{top:10px;left:10px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="c" tabindex="0" aria-label="3D view of the bathroom. Drag a fitting to move it."></canvas>
    <div class="views" role="group" aria-label="Camera view">
      <button type="button" data-view="orbit" aria-pressed="true">3D</button>
      <button type="button" data-view="plan" aria-pressed="false">Plan</button>
      <button type="button" data-view="door" aria-pressed="false">From the door</button>
    </div>
    <div class="hint" id="hint">Drag a fitting to move it. It snaps to the nearest wall. Drag empty space to look around.</div>
  </div>

  <aside class="panel">
    <h1>Bathroom planner</h1>
    <p class="room-sum" id="roomSum"></p>
    <div class="status" id="status" role="status"></div>
    <ul class="issues" id="issues"></ul>

    <section id="selSec" hidden>
      <div class="sel">
        <h2 id="selName"></h2>
        <p class="meta" id="selSize"></p>
        <dl class="gaps" id="selGaps"></dl>
        <div class="row">
          <button type="button" class="btn" id="rotL">Turn left</button>
          <button type="button" class="btn" id="rotR">Turn right</button>
          <button type="button" class="btn danger" id="del">Remove</button>
        </div>
        <p class="keys">Arrow keys nudge it 10 mm. R turns it. Delete removes it.</p>
      </div>
    </section>

    <section>
      <h2>Start from a layout</h2>
      <div class="layouts" id="layouts"></div>
    </section>

    <section>
      <h2>Add a fitting</h2>
      <div class="adds" id="adds"></div>
    </section>

    <section>
      <h2>Finishes</h2>
      <div id="looks"></div>
    </section>

    <section>
      <h2>Room and door</h2>
      <div class="fields">
        <label>Length (mm)<input type="number" inputmode="numeric" id="fL" step="10"></label>
        <label>Width (mm)<input type="number" inputmode="numeric" id="fW" step="10"></label>
        <label>Height (mm)<input type="number" inputmode="numeric" id="fH" step="10"></label>
        <span></span>
        <label>Door corner, along right wall (mm)<input type="number" inputmode="numeric" id="fCz" step="10"></label>
        <label>Door corner, along near wall (mm)<input type="number" inputmode="numeric" id="fCx" step="10"></label>
      </div>
      <p class="sub">Door opens</p>
      <div class="seg" id="segSwing">
        <button type="button" data-v="out">Outwards</button>
        <button type="button" data-v="in">Into the room</button>
      </div>
      <p class="sub">Hinges, seen from outside</p>
      <div class="seg" id="segHinge">
        <button type="button" data-v="left">Left side</button>
        <button type="button" data-v="right">Right side</button>
      </div>
      <p class="door-info" id="doorInfo"></p>
      <div class="toggles">
        <label><input type="checkbox" id="tOpen"> Show the door open</label>
        <label><input type="checkbox" id="tPipes"> Show macerator pipework</label>
        <label><input type="checkbox" id="tSnap"> Snap fittings to walls</label>
      </div>
      <button type="button" class="btn reset" id="reset">Start again</button>
    </section>
  </aside>
</div>

<script src="../vendor/three.min.js"></script>
<script src="../vendor/OrbitControls.js"></script>
<script>
(() => {
'use strict';
const PI = Math.PI, TAU = PI * 2;
const KEY = 'bathroom-planner-v1';
const ACC = 0xa8551f, BAD = 0xc0392b, T = 0.08;
const mm = v => Math.round(v * 1000);
const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
const $ = s => document.querySelector(s);
let uid = 1;
const nid = () => 'i' + Date.now().toString(36) + (uid++);

/* ---------- Catalogue (metres; w = width, d = depth from wall, y0 = bottom height, h = height) ---------- */
const CAT = {
  wc_rear:    {name:'WC with macerator behind', group:'WCs', w:.47, d:.78, y0:0, h:.81, wc:true, mac:true},
  wc_compact: {name:'Compact WC, built-in macerator', group:'WCs', w:.38, d:.56, y0:0, h:.83, wc:true, mac:true},
  wc_short:   {name:'Short projection WC', group:'WCs', w:.36, d:.60, y0:0, h:.81, wc:true},
  macerator:  {name:'Macerator unit', group:'WCs', w:.47, d:.16, y0:0, h:.30, mac:true},
  basin400:   {name:'Cloakroom basin 400', group:'Basins', w:.40, d:.25, y0:.72, h:.28},
  basin350:   {name:'Slim basin 350', group:'Basins', w:.35, d:.20, y0:.72, h:.28},
  corner:     {name:'Corner basin', group:'Basins', w:.452, d:.306, y0:.72, h:.28, corner:true, c:.153,
               fp:[[0,-.153],[.226,.073],[.12,.153],[-.12,.153],[-.226,.073]]},
  vanity:     {name:'Slim vanity unit', group:'Basins', w:.45, d:.25, y0:0, h:1.0},
  mirror:     {name:'Mirror', group:'Extras', w:.40, d:.03, y0:1.10, h:.60},
  rail:       {name:'Towel rail', group:'Extras', w:.40, d:.10, y0:1.02, h:.70}
};

const LAYOUTS = {
  a: 'Standard WC, macerator behind',
  b: 'Compact WC, slim basin',
  c: 'Compact WC, vanity unit'
};
function preset(k, r) {
  const {L, W} = r;
  const rows = {
    a: [['wc_rear', .39, W/2, PI/2], ['basin400', L-.33, .125, 0], ['mirror', L-.33, .015, 0]],
    b: [['wc_compact', .28, W/2, PI/2], ['basin350', L-.31, .10, 0], ['mirror', L-.31, .015, 0], ['rail', .5, W-.05, PI]],
    c: [['wc_compact', .28, W/2, PI/2], ['vanity', L-.34, .125, 0], ['mirror', L-.34, .015, 0]]
  }[k];
  return rows.map(([type, x, z, rot]) => ({id:nid(), type, x, z, rot, wall:-1}));
}

const LOOK = {
  glass: {label:'Glass blocks', opts:{
    clear:{n:'Clear', sw:'#dcebee', op:.62}, frosted:{n:'Frosted', sw:'#eef1f2', op:.86},
    aqua:{n:'Aqua', sw:'#a9dcd6', op:.68}, ice:{n:'Ice blue', sw:'#b3cbe6', op:.68},
    mixed:{n:'Clear with colour', sw:'linear-gradient(135deg,#dcebee 50%,#6fbcb2 50%)', op:.64}}},
  floor: {label:'Floor', opts:{
    slate:{n:'Grey slate', sw:'#60676e', r:.6}, white:{n:'White tile', sw:'#efefec', r:.22},
    check:{n:'Chequer', sw:'linear-gradient(90deg,#2b2d30 50%,#f2f2f0 50%)', r:.3},
    oak:{n:'Oak effect', sw:'#b88a5a', r:.55}, terrazzo:{n:'Terrazzo', sw:'#e6e1d8', r:.35}}},
  ware: {label:'Toilet and basin', opts:{
    white:{n:'Gloss white', sw:'#f7f7f5', c:0xf7f7f5, r:.1}, black:{n:'Matt black', sw:'#2a2c2e', c:0x2a2c2e, r:.5},
    stone:{n:'Stone', sw:'#bdb7ad', c:0xbdb7ad, r:.35}}},
  metal: {label:'Taps and rail', opts:{
    chrome:{n:'Chrome', sw:'#d9dee3', c:0xe3e7ea, m:1, r:.12}, brass:{n:'Brushed brass', sw:'#c9a15a', c:0xc9a15a, m:1, r:.32},
    black:{n:'Matt black', sw:'#26282a', c:0x26282a, m:.3, r:.55}}},
  wood: {label:'Door and vanity', opts:{
    white:{n:'White', sw:'#f1f1ec', c:0xf1f1ec}, oak:{n:'Oak', sw:'#b58a5a', c:0xb58a5a},
    sage:{n:'Sage', sw:'#98a891', c:0x98a891}, navy:{n:'Navy', sw:'#2f3e56', c:0x2f3e56}}}
};

/* ---------- State ---------- */
function fresh() {
  const room = {L:1.38, W:.71, H:2.3, cx:.5, cz:.5};
  return {v:1, room, door:{swing:'out', hinge:'right', open:true}, pipes:true, snap:true,
    look:{glass:'clear', floor:'slate', ware:'white', metal:'chrome', wood:'white'}, layout:'a', items:preset('a', room)};
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1 && Array.isArray(s.items)) return s; } catch (e) {}
  return null;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
let S = load() || fresh();
S.items = S.items.filter(it => CAT[it.type]);
let sel = null, lastBad = new Set(), doorClash = false;

/* ---------- Plan geometry ---------- */
const NAMES = ['far', 'right', 'door', 'near', 'left'];
function roomPoly(r) { return [[0,0],[r.L,0],[r.L,r.W-r.cz],[r.L-r.cx,r.W],[0,r.W]]; }
function edges(r) {
  const P = roomPoly(r);
  const cen = P.reduce((a,p) => [a[0]+p[0]/P.length, a[1]+p[1]/P.length], [0,0]);
  return P.map((a, i) => {
    const b = P[(i+1) % P.length], dx = b[0]-a[0], dz = b[1]-a[1], len = Math.hypot(dx, dz);
    const u = [dx/len, dz/len]; let n = [-u[1], u[0]];
    if ((cen[0]-a[0])*n[0] + (cen[1]-a[1])*n[1] < 0) n = [-n[0], -n[1]];
    return {a, b, u, n, len, name:NAMES[i], door:i === 2};
  });
}
function corners(E) {
  const out = [];
  E.forEach((e, i) => {
    const p = E[(i + E.length - 1) % E.length];
    if (Math.abs(p.u[0]*e.u[0] + p.u[1]*e.u[1]) < .02) {
      let bx = e.u[0] - p.u[0], bz = e.u[1] - p.u[1]; const l = Math.hypot(bx, bz);
      out.push({V:e.a, bis:[bx/l, bz/l]});
    }
  });
  return out;
}
const inside = (p, E) => E.every(e => (p[0]-e.a[0])*e.n[0] + (p[1]-e.a[1])*e.n[1] >= -.0015);
function localFP(d) { return d.fp || [[-d.w/2,-d.d/2],[d.w/2,-d.d/2],[d.w/2,d.d/2],[-d.w/2,d.d/2]]; }
function toWorld(it, [lx, lz]) { const c = Math.cos(it.rot), s = Math.sin(it.rot); return [it.x + lx*c + lz*s, it.z - lx*s + lz*c]; }
const worldFP = it => localFP(CAT[it.type]).map(p => toWorld(it, p));
function proj(P, ax) { let a = Infinity, b = -Infinity; P.forEach(p => { const v = p[0]*ax[0] + p[1]*ax[1]; a = Math.min(a, v); b = Math.max(b, v); }); return [a, b]; }
function overlap(A, B) {
  let min = Infinity;
  for (const P of [A, B]) for (let i = 0; i < P.length; i++) {
    const a = P[i], b = P[(i+1) % P.length]; let ax = [-(b[1]-a[1]), b[0]-a[0]]; const l = Math.hypot(ax[0], ax[1]);
    ax = [ax[0]/l, ax[1]/l];
    const [a0, a1] = proj(A, ax), [b0, b1] = proj(B, ax);
    const pen = Math.min(a1 - b0, b1 - a0); if (pen <= 0) return 0; min = Math.min(min, pen);
  }
  return min;
}
const heightOv = (a, b) => a.y0 < b.y0 + b.h - .005 && b.y0 < a.y0 + a.h - .005;
function samplePts(P) { const o = []; P.forEach((a, i) => { const b = P[(i+1) % P.length]; for (let k = 0; k < 4; k++) o.push([a[0]+(b[0]-a[0])*k/4, a[1]+(b[1]-a[1])*k/4]); }); return o; }
function doorGeom(r) {
  const e = edges(r)[2], fw = .035, leaf = e.len - 2*fw, hingeA = S.door.hinge === 'right';
  const H = hingeA ? [e.a[0]+e.u[0]*fw, e.a[1]+e.u[1]*fw] : [e.b[0]-e.u[0]*fw, e.b[1]-e.u[1]*fw];
  const closed = hingeA ? e.u : [-e.u[0], -e.u[1]];
  const m = S.door.swing === 'in' ? e.n : [-e.n[0], -e.n[1]];
  return {e, fw, leaf, H, closed, m};
}
function inSector(p, g) {
  const d = [p[0]-g.H[0], p[1]-g.H[1]];
  return Math.hypot(d[0], d[1]) <= g.leaf + .01 && d[0]*g.closed[0] + d[1]*g.closed[1] >= -.005 && d[0]*g.m[0] + d[1]*g.m[1] >= .005;
}
function segHit(p, d, a, b) {
  const ex = b[0]-a[0], ez = b[1]-a[1], den = d[0]*ez - d[1]*ex; if (Math.abs(den) < 1e-9) return Infinity;
  const wx = a[0]-p[0], wz = a[1]-p[1], t = (wx*ez - wz*ex)/den, u = (wx*d[1] - wz*d[0])/den;
  return (t > 1e-4 && u >= -1e-6 && u <= 1 + 1e-6) ? t : Infinity;
}
function cast(p, d, polys) {
  let t = Infinity;
  edges(S.room).forEach(e => t = Math.min(t, segHit(p, d, e.a, e.b)));
  polys.forEach(P => P.forEach((a, i) => t = Math.min(t, segHit(p, d, a, P[(i+1) % P.length]))));
  return t === Infinity ? 0 : t;
}
function gaps(it) {
  const d = CAT[it.type], c = Math.cos(it.rot), s = Math.sin(it.rot), f = [s, c], rt = [c, -s];
  const obst = S.items.filter(o => o.id !== it.id && heightOv(CAT[o.type], {y0:0, h:1.2})).map(worldFP);
  return {
    front: cast(toWorld(it, [0, d.d/2 - .001]), f, obst),
    left: cast(toWorld(it, [-d.w/2 + .001, 0]), [-rt[0], -rt[1]], obst),
    right: cast(toWorld(it, [d.w/2 - .001, 0]), rt, obst)
  };
}
function snapTo(it, e, t) {
  const d = CAT[it.type], off = d.d/2 + .001;
  it.rot = Math.atan2(e.n[0], e.n[1]);
  it.x = e.a[0] + e.u[0]*t + e.n[0]*off; it.z = e.a[1] + e.u[1]*t + e.n[1]*off;
}
function setCorner(it, v) { const d = CAT[it.type]; it.rot = Math.atan2(v.bis[0], v.bis[1]); it.x = v.V[0] + v.bis[0]*d.c; it.z = v.V[1] + v.bis[1]*d.c; }
function fits(it) {
  const E = edges(S.room), fp = worldFP(it), d = CAT[it.type];

    const m = new THREE.MeshStandardMaterial({map:t, transparent:true, opacity:look.op, roughness:.06, metalness:0, depthWrite:false, envMapIntensity:1.3, clippingPlanes:[cut]});
    m.userData.base = look.op; return m;
  };
  const floor = new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(roomPoly(r).map(([x, z]) => new THREE.Vector2(x, -z)))), M.floor);
  floor.geometry.rotateX(-PI/2); floor.receiveShadow = true; roomG.add(floor);

  E.forEach((e, i) => {
    const ang = Math.atan2(-e.u[1], e.u[0]), prev = E[(i + E.length - 1) % E.length], next = E[(i + 1) % E.length];
    const sqA = Math.abs(prev.u[0]*e.u[0] + prev.u[1]*e.u[1]) < .02, sqB = Math.abs(next.u[0]*e.u[0] + next.u[1]*e.u[1]) < .02;
    const long = e.name === 'far' || e.name === 'near';
    const extA = sqA ? (long ? T : 0) : T*.42, extB = sqB ? (long ? T : 0) : T*.42;
    const entry = {c:new THREE.Vector3(e.a[0] + e.u[0]*e.len/2, r.H/2, e.a[1] + e.u[1]*e.len/2), n:e.n, mats:[]};
    const along = (e.len + extB - extA)/2;
    if (!e.door) {
      const len = e.len + extA + extB, mat = glassMat(len, r.H);
      const m = new THREE.Mesh(new THREE.BoxGeometry(len, r.H, T), mat);
      m.position.set(e.a[0] + e.u[0]*along - e.n[0]*T/2, r.H/2, e.a[1] + e.u[1]*along - e.n[1]*T/2);
      m.rotation.y = ang; m.renderOrder = 1; m.receiveShadow = true; roomG.add(m); entry.mats.push(mat);
    } else {
      const DH = 2.02, fw = .035, wood = M.wood.clone(), met = M.metal.clone();
      [wood, met].forEach(m => { m.transparent = true; m.userData.base = 1; m.clippingPlanes = [cut]; });
      const fr = new THREE.Group(); fr.position.set(e.a[0] - e.n[0]*T/2, 0, e.a[1] - e.n[1]*T/2); fr.rotation.y = ang;
      fr.add(at(box(fw, DH, T + .01, wood), fw/2, DH/2, 0), at(box(fw, DH, T + .01, wood), e.len - fw/2, DH/2, 0), at(box(e.len, .05, T + .01, wood), e.len/2, DH + .025, 0));
      const gh = r.H - DH - .05;
      if (gh > .02) { const gl = glassMat(e.len + extA + extB, gh); const m = new THREE.Mesh(new THREE.BoxGeometry(e.len + extA + extB, gh, T), gl); m.renderOrder = 1; fr.add(at(m, along, DH + .05 + gh/2, 0)); entry.mats.push(gl); }
      roomG.add(fr);
      const dg = doorGeom(r), lw = Math.max(.1, dg.leaf - .006), phi = S.door.open ? 75*PI/180 : 0;
      const dir = [dg.closed[0]*Math.cos(phi) + dg.m[0]*Math.sin(phi), dg.closed[1]*Math.cos(phi) + dg.m[1]*Math.sin(phi)];
      const pv = new THREE.Group(); pv.position.set(dg.H[0] - e.n[0]*T/2, 0, dg.H[1] - e.n[1]*T/2); pv.rotation.y = Math.atan2(-dir[1], dir[0]);
      pv.add(at(box(lw, DH - .015, .04, wood), lw/2 + .003, (DH - .015)/2, 0));
      [-1, 1].forEach(sd => {
        const rose = cyl(.025, .025, .01, met, 20); rose.rotation.x = PI/2; pv.add(at(rose, lw - .06, 1.02, sd*.025));
        pv.add(at(box(.11, .016, .016, met), lw - .1, 1.02, sd*.038));
      });
      roomG.add(pv); entry.mats.push(wood, met);
      const pts = [];
      for (let k = 0; k <= 24; k++) { const a = k/24*PI/2; pts.push(new THREE.Vector3(dg.H[0] + (dg.closed[0]*Math.cos(a) + dg.m[0]*Math.sin(a))*dg.leaf, .006, dg.H[1] + (dg.closed[1]*Math.cos(a) + dg.m[1]*Math.sin(a))*dg.leaf)); }
      pts.push(new THREE.Vector3(dg.H[0], .006, dg.H[1]));
      arc = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineDashedMaterial({color:0x7b8791, dashSize:.03, gapSize:.02}));
      arc.computeLineDistances(); roomG.add(arc);
    }
    walls.push(entry);
  });

  const lc = isDark() ? '#9aa7b3' : '#5b6874', lhex = isDark() ? 0x6f7c88 : 0x8a96a1;
  roomG.add(dimLine([0, -.15], [r.L, -.15], .03, lhex), dimLine([-.15, 0], [-.15, r.W], .03, lhex));
  const l1 = label(`${mm(r.L)} mm`, .075, lc); l1.position.set(r.L/2, .004, -.25); roomG.add(l1);
  const l2 = label(`${mm(r.W)} mm`, .075, lc); l2.position.set(-.25, .004, r.W/2); l2.rotation.y = PI/2; roomG.add(l2);
  const de = E[2], dg = doorGeom(r), mid = [(de.a[0] + de.b[0])/2, (de.a[1] + de.b[1])/2];
  const l3 = label(`Door ${mm(dg.leaf)} mm`, .065, lc); l3.position.set(mid[0] - de.n[0]*.34, .004, mid[1] - de.n[1]*.34); l3.rotation.y = Math.atan2(de.u[1], -de.u[0]); roomG.add(l3);

  bulb.position.set(r.L/2, r.H - .2, r.W/2);
  sun.target.position.set(r.L/2, 0, r.W/2);
}

function buildItems() {
  dispose(itemsG);
  S.items.forEach(it => { const g = buildItem(it); g.position.set(it.x, 0, it.z); g.rotation.y = it.rot; itemsG.add(g); });
}
function syncItem(it) { const g = itemsG.children.find(c => c.userData.itemId === it.id); if (g) { g.position.set(it.x, 0, it.z); g.rotation.y = it.rot; } }
const getItem = id => S.items.find(i => i.id === id);

/* ---------- Theme ---------- */
function isDark() {
  const t = document.documentElement.dataset.theme;
  return t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
}
function applyTheme() {
  const d = isDark();
  scene.background = new THREE.Color(d ? 0x1a2128 : 0xdce2e6).convertSRGBToLinear();
  col(ground.material, d ? 0x232b33 : 0xcfd6db);
}

/* ---------- Panel ---------- */
function refresh(persist = true) {
  const issues = evaluate();
  itemsG.children.forEach(g => {
    const id = g.userData.itemId, b = lastBad.has(id), s = id === sel, c = b ? BAD : ACC;
    g.userData.fill.visible = g.userData.line.visible = b || s;
    g.userData.fill.material.color.setHex(c); g.userData.line.material.color.setHex(c);
  });
  if (arc) arc.material.color.setHex(doorClash ? BAD : 0x7b8791);
  const bads = issues.filter(i => i[0] === 'bad').length, warns = issues.length - bads, st = $('#status');
  st.className = 'status ' + (bads ? 'bad' : warns ? 'warn' : 'ok');
  st.textContent = bads ? `${bads} ${bads === 1 ? 'problem' : 'problems'} to fix` : warns ? `Fits, with ${warns} ${warns === 1 ? 'thing' : 'things'} to check` : 'Everything fits';
  const ul = $('#issues'); ul.innerHTML = '';
  issues.forEach(([lvl, msg]) => { const li = document.createElement('li'); li.className = lvl; li.textContent = msg; ul.appendChild(li); });
  const it = sel && getItem(sel);
  $('#selSec').hidden = !it;
  if (it) {
    const d = CAT[it.type], g = gaps(it);
    $('#selName').textContent = d.name;
    $('#selSize').textContent = `${mm(d.w)} mm wide, ${mm(d.d)} mm from the wall` + (d.y0 >= .7 ? `, fixed at ${mm(d.y0)} mm up` : '');
    $('#selGaps').innerHTML = `<dt>Clear in front</dt><dd>${mm(g.front)} mm</dd><dt>Gap each side</dt><dd>${mm(g.left)} mm and ${mm(g.right)} mm</dd>`;
  }
  $('#roomSum').textContent = `${mm(S.room.L)} × ${mm(S.room.W)} mm room with glass block walls`;
  $('#doorInfo').textContent = `The corner opening takes a door up to ${mm(doorGeom(S.room).leaf)} mm wide.`;
  document.querySelectorAll('#layouts button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === S.layout)));
  if (persist) save();
}
function select(id) { sel = id; refresh(false); }

function buildPanel() {
  const lay = $('#layouts');
  Object.entries(LAYOUTS).forEach(([k, n]) => {
    const b = document.createElement('button'); b.type = 'button'; b.dataset.k = k; b.textContent = n;
    b.onclick = () => { S.items = preset(k, S.room); S.layout = k; sel = null; buildItems(); refresh(); };
    lay.appendChild(b);
  });
  const adds = $('#adds'); let grp = null;
  Object.entries(CAT).forEach(([k, d]) => {
    if (d.group !== grp) { grp = d.group; const h = document.createElement('h3'); h.textContent = grp; adds.appendChild(h); }
    const b = document.createElement('button'); b.type = 'button';
    b.innerHTML = `${d.name}<span>${mm(d.w)} × ${mm(d.d)}</span>`;
    b.onclick = () => addItem(k); adds.appendChild(b);
  });
  const looks = $('#looks');
  Object.entries(LOOK).forEach(([key, grp]) => {
    const wrap = document.createElement('div'); wrap.className = 'look';
    wrap.innerHTML = `<span>${grp.label}</span>`;
    const chips = document.createElement('div'); chips.className = 'chips';
    Object.entries(grp.opts).forEach(([v, o]) => {
      const b = document.createElement('button'); b.type = 'button'; b.dataset.v = v;
      b.innerHTML = `<i style="background:${o.sw}"></i>${o.n}`;
      b.onclick = () => {
        S.look[key] = v; applyMaterials();
        if (key === 'glass' || key === 'wood') buildRoom();
        syncChips(); refresh();
      };
      chips.appendChild(b);
    });
    wrap.appendChild(chips); looks.appendChild(wrap);
  });
  syncChips();

  const fields = {fL:'L', fW:'W', fH:'H', fCx:'cx', fCz:'cz'};
  Object.entries(fields).forEach(([id, k]) => {
    const el = $('#' + id);
    el.addEventListener('change', () => {
      const v = parseFloat(el.value) / 1000; if (!isFinite(v)) { syncFields(); return; }
      const r = {...S.room, [k]:v};
      r.L = clamp(r.L, .8, 5); r.W = clamp(r.W, .6, 4); r.H = clamp(r.H, 1.9, 3.2);
      r.cx = clamp(r.cx, .3, r.L - .2); r.cz = clamp(r.cz, .3, r.W - .02);
      S.room = r; syncFields(); buildRoom(); buildItems(); refresh();
    });
  });
  syncFields();
  seg('#segSwing', () => S.door.swing, v => { S.door.swing = v; });
  seg('#segHinge', () => S.door.hinge, v => { S.door.hinge = v; });
  const tog = (id, get, set, rebuild) => { const el = $(id); el.checked = get(); el.onchange = () => { set(el.checked); rebuild(); refresh(); }; };
  tog('#tOpen', () => S.door.open, v => S.door.open = v, buildRoom);
  tog('#tPipes', () => S.pipes, v => S.pipes = v, buildItems);
  tog('#tSnap', () => S.snap, v => S.snap = v, () => {});
  $('#reset').onclick = () => { S = fresh(); sel = null; applyMaterials(); syncChips(); syncFields(); syncSegs(); $('#tOpen').checked = true; $('#tPipes').checked = true; $('#tSnap').checked = true; buildRoom(); buildItems(); refresh(); goView('orbit'); };
  $('#rotL').onclick = () => rotate(PI/2);
  $('#rotR').onclick = () => rotate(-PI/2);
  $('#del').onclick = remove;
}
const segs = [];
function seg(q, get, set) {
  const el = $(q); segs.push([el, get]);
  el.querySelectorAll('button').forEach(b => b.onclick = () => { set(b.dataset.v); syncSegs(); buildRoom(); refresh(); });
  syncSegs();
}
function syncSegs() { segs.forEach(([el, get]) => el.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === get())))); }
function syncChips() { document.querySelectorAll('#looks .look').forEach((w, i) => { const key = Object.keys(LOOK)[i]; w.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.look[key]))); }); }
function syncFields() { $('#fL').value = mm(S.room.L); $('#fW').value = mm(S.room.W); $('#fH').value = mm(S.room.H); $('#fCx').value = mm(S.room.cx); $('#fCz').value = mm(S.room.cz); }

function addItem(type) {
  const d = CAT[type], it = {id:nid(), type, x:S.room.L/2, z:S.room.W/2, rot:0, wall:-1}, E = edges(S.room);
  let placed = false;
  if (d.corner) { for (const v of corners(E)) { setCorner(it, v); if (fits(it)) { placed = true; break; } } }
  else {
    outer: for (let i = 0; i < E.length; i++) {
      const e = E[i]; if (e.door || e.len < d.w) continue;
      for (let t = d.w/2; t <= e.len - d.w/2 + 1e-6; t += .02) { snapTo(it, e, t); it.wall = i; if (fits(it)) { placed = true; break outer; } }
    }
  }
  if (!placed) { it.x = S.room.L/2; it.z = S.room.W/2; it.rot = 0; it.wall = -1; }
  S.items.push(it); buildItems(); sel = it.id; refresh();
}
function rotate(a) { const it = sel && getItem(sel); if (!it) return; it.rot = Math.atan2(Math.sin(it.rot + a), Math.cos(it.rot + a)); it.wall = -1; syncItem(it); refresh(); }
function remove() { if (!sel) return; S.items = S.items.filter(i => i.id !== sel); sel = null; buildItems(); refresh(); }

/* ---------- Dragging ---------- */
function dragPlace(it, px, pz) {
  const d = CAT[it.type], E = edges(S.room);
  if (S.snap) {
    if (d.corner) {
      let best = null;
      corners(E).forEach(v => { const dist = Math.hypot(px - (v.V[0] + v.bis[0]*d.c), pz - (v.V[1] + v.bis[1]*d.c)); if (dist < .18 && (!best || dist < best.dist)) best = {v, dist}; });
      if (best) { setCorner(it, best.v); return; }
    } else {
      let best = null;
      E.forEach((e, i) => {
        if (e.door || e.len < d.w - 1e-6) return;
        const t = (px - e.a[0])*e.u[0] + (pz - e.a[1])*e.u[1], dist = (px - e.a[0])*e.n[0] + (pz - e.a[1])*e.n[1];
        if (t < -.15 || t > e.len + .15) return;
        let score = Math.abs(dist - d.d/2); if (i === it.wall) score -= .04;
        if (score < .13 && (!best || score < best.score)) best = {e, i, t, score};
      });
      if (best) { snapTo(it, best.e, clamp(best.t, d.w/2, best.e.len - d.w/2)); it.wall = best.i; return; }
    }
  }
  it.wall = -1; it.x = clamp(px, -.1, S.room.L + .1); it.z = clamp(pz, -.1, S.room.W + .1);
}
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function setRay(e) { const r = canvas.getBoundingClientRect(); ndc.set(((e.clientX - r.left)/r.width)*2 - 1, -((e.clientY - r.top)/r.height)*2 + 1); ray.setFromCamera(ndc, camera); }
function pick(e) {
  setRay(e);
  const hit = ray.intersectObjects(itemsG.children, true).find(h => h.object.isMesh && h.object !== h.object.parent.userData.fill);
  if (!hit) return null; let o = hit.object; while (o && !o.userData.itemId) o = o.parent; return o ? o.userData.itemId : null;
}
function floorAt(e) { setRay(e); const p = new THREE.Vector3(); return ray.ray.intersectPlane(floorPlane, p) ? p : null; }
let drag = null, down = null;
const hint = $('#hint');
// Registered before OrbitControls so it can switch the controls off before they react
canvas.addEventListener('pointerdown', e => {
  if (drag) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  down = {x:e.clientX, y:e.clientY};
  const id = pick(e); if (!id) return;
  const it = getItem(id), p = floorAt(e); select(id);
  if (p) { drag = {id, off:[p.x - it.x, p.z - it.z]}; controls.enabled = false; canvas.setPointerCapture(e.pointerId); canvas.style.cursor = 'grabbing'; hint.hidden = true; }
});
canvas.addEventListener('pointermove', e => {
  if (drag) { const p = floorAt(e); if (!p) return; const it = getItem(drag.id); dragPlace(it, p.x - drag.off[0], p.z - drag.off[1]); syncItem(it); refresh(false); }
  else if (e.pointerType === 'mouse' && !e.buttons) canvas.style.cursor = pick(e) ? 'grab' : '';
});
const endDrag = e => {
  if (drag) { drag = null; controls.enabled = true; canvas.style.cursor = ''; refresh(); }
  else if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 5 && !pick(e)) select(null);
  down = null;
};
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = .09;
controls.minDistance = .8; controls.maxDistance = 9; controls.maxPolarAngle = PI/2 - .04;
controls.addEventListener('start', () => { if (!drag) hint.hidden = true; });

window.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase(); if (['input', 'select', 'textarea'].includes(tag)) return;
  const it = sel && getItem(sel); if (!it) return;
  const step = e.shiftKey ? .05 : .01, mv = {ArrowLeft:[-step, 0], ArrowRight:[step, 0], ArrowUp:[0, -step], ArrowDown:[0, step]}[e.key];
  if (mv) { e.preventDefault(); it.x += mv[0]; it.z += mv[1]; it.wall = -1; syncItem(it); refresh(); }
  else if (e.key === 'r' || e.key === 'R') rotate(e.shiftKey ? -PI/2 : PI/2);
  else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); remove(); }
  else if (e.key === 'Escape') select(null);
});

/* ---------- Views ---------- */
let tw = null;
function viewPose(v) {
  const r = S.room, cx = r.L/2, cz = r.W/2, fov = camera.fov*PI/180, asp = camera.aspect || 1;
  if (v === 'plan') { const h = 1 + Math.max(r.L*1.5/asp, r.W*1.9, 1.2)/(2*Math.tan(fov/2)); return {p:[cx, h, cz + .001], t:[cx, 0, cz]}; }
  if (v === 'door') { const e = edges(r)[2], m = [(e.a[0] + e.b[0])/2, (e.a[1] + e.b[1])/2]; return {p:[m[0] - e.n[0]*1.7, 1.65, m[1] - e.n[1]*1.7], t:[cx - .1, .7, cz]}; }
  const k = asp < 1 ? 1/Math.sqrt(asp) : 1;
  return {p:[cx + 1.75*k, 2.9 + .5*(k - 1), r.W + 2.95*k], t:[cx, 1.0, cz]};
}
function goView(v) {
  document.querySelectorAll('.views button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
  const {p, t} = viewPose(v);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { camera.position.set(...p); controls.target.set(...t); controls.update(); return; }
  tw = {t0:performance.now(), p0:camera.position.clone(), q0:controls.target.clone(), p1:new THREE.Vector3(...p), q1:new THREE.Vector3(...t)};
}
document.querySelectorAll('.views button').forEach(b => b.onclick = () => goView(b.dataset.view));

/* ---------- Loop ---------- */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
const tmp = new THREE.Vector3();
function loop(now) {
  if (tw) {
    const k = Math.min(1, (now - tw.t0)/650), e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2)/2;
    camera.position.lerpVectors(tw.p0, tw.p1, e); controls.target.lerpVectors(tw.q0, tw.q1, e); if (k >= 1) tw = null;
  }
  controls.update();
  cut.constant = controls.getPolarAngle() < .3 ? 1.05 : 100;
  walls.forEach(w => {
    tmp.copy(camera.position).sub(w.c);
    const out = tmp.x*w.n[0] + tmp.z*w.n[1] < 0;
    w.mats.forEach(m => { const target = out ? .07 : m.userData.base; m.opacity += (target - m.opacity)*.18; m.depthWrite = !out && m.userData.base === 1; });
  });
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

/* ---------- Start ---------- */
applyTheme(); applyMaterials(); buildPanel(); buildRoom(); buildItems(); resize();
{ const {p, t} = viewPose('orbit'); camera.position.set(...p); controls.target.set(...t); controls.update(); }
refresh(false);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { applyTheme(); buildRoom(); refresh(false); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { buildRoom(); refresh(false); });
requestAnimationFrame(loop);
})();
</script>
</body>
